# Godot gradle build settings.
# These properties apply when running a gradle build from the Godot editor.
# NOTE: This should be kept in sync with 'godot/platform/android/java/gradle.properties' except
# where otherwise specified.

# For more details on how to configure your build environment visit
# https://www.gradle.org/docs/current/userguide/build_environment.html

android.enableJetifier=true
android.useAndroidX=true

# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
org.gradle.jvmargs=-Xmx4536m

# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. More details, visit
# https://www.gradle.org/docs/current/userguide/multi_project_builds.html#sec:decoupled_projects
# org.gradle.parallel=true

org.gradle.warning.mode=all

# Enable resource optimizations for release build.
# NOTE: This is turned off for template release build in order to support the build legacy process.
android.enableResourceOptimizations=true

# Fix gradle build errors when the build path contains non-ASCII characters
android.overridePathCheck=true

# --- Sobrevive al Parcial ---
# Valores que usa Android Studio al compilar desde aquí (botón Run o Build > Build APK).
# Cuando se exporta desde Godot, Godot los reemplaza con los de export_presets.cfg.
export_package_name=com.equipo.sobrevivealparcial
export_version_code=1
export_version_name=1.0
export_version_min_sdk=24
export_version_target_sdk=36
# armeabi-v7a = celulares viejos de 32 bits; arm64-v8a = celulares; x86_64 = emulador
export_enabled_abis=armeabi-v7a|arm64-v8a|x86_64
# Firmar con la llave de depuración de Android Studio también al compilar desde la terminal
perform_signing=true
perform_zipalign=true

# Android 16 (API 36): lo exige Google Play desde el 31 de agosto de 2026
android.suppressUnsupportedCompileSdk=36
